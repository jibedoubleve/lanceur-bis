# When a pull request is merged (and thus a push occurs),
# execute tests and release the packages on GitHub.
name: Release
on:
  push:
    branches: 
      - master
      - 'release/**'
jobs:
  build:
    name: Release
    runs-on: windows-latest
    steps:
      - name: Get the sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
                  
      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore

      - name: Install Inno Setup
        run: choco install innosetup -y        
        
      - name: Run the Cake script
        uses: cake-build/cake-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAKE_PUBLIC_GITHUB_TOKEN: ${{secrets.CAKE_PUBLIC_GITHUB_TOKEN}}
          CAKE_PUBLIC_GITHUB_USERNAME: ${{secrets.CAKE_PUBLIC_GITHUB_USERNAME}}
        with:
          target: github       
  todo:
      runs-on: ubuntu-latest
      permissions:
          contents: write
          issues: write
          pull-requests: write
      steps:
          - name: Get the sources
            uses: actions/checkout@v7
  
          - name: TODO to Issue
            uses: alstr/todo-to-issue-action@64aca8fda7023259aada83ba44ad988c4c443657
            with:
                IDENTIFIERS: '[{"name": "REFACTOR", "labels": ["tech-debt", "needs-triage"]}]'
                INSERT_ISSUE_URLS: "true"
                CLOSE_ISSUES: "true"
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # The branch is protected: issue links go through a PR to merge manually.
          # [skip ci] in the title keeps the squash-merge from triggering a release.
          - name: Open a PR with the issue URLs inserted into TODOs
            uses: peter-evans/create-pull-request@v8
            with:
                branch: todo/issue-links-${{ github.ref_name }}
                commit-message: "(chore) Add GitHub issue links to REFACTOR comments [skip ci]"
                title: "(chore) Add GitHub issue links to REFACTOR comments [skip ci]"
                body: "Inserts the `Issue URL` lines added by `todo-to-issue-action` for newly created tech-debt issues."
                labels: skip-changelog
                delete-branch: true