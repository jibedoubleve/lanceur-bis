# When a pull request is merged (and thus a push occurs),
# execute tests and release the packages on GitHub.
name: Release
on:
  push:
    branches: 
      - master
      - 'release/**'
jobs:
  build:
    name: Release
    runs-on: windows-latest
    steps:
      - name: Get the sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
                  
      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore

      - name: Install Inno Setup
        run: choco install innosetup -y        
        
      - name: Run the Cake script
        uses: cake-build/cake-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAKE_PUBLIC_GITHUB_TOKEN: ${{secrets.CAKE_PUBLIC_GITHUB_TOKEN}}
          CAKE_PUBLIC_GITHUB_USERNAME: ${{secrets.CAKE_PUBLIC_GITHUB_USERNAME}}
        with:
          target: github       
  todo:
      runs-on: ubuntu-latest
      permissions:
          contents: write
          issues: write
          pull-requests: write
      steps:
          - name: Get the sources
            uses: actions/checkout@v7
  
          - name: TODO to Issue
            uses: alstr/todo-to-issue-action@64aca8fda7023259aada83ba44ad988c4c443657
            with:
                IDENTIFIERS: '[{"name": "REFACTOR", "labels": ["tech-debt", "ungroomed"]}]'
                INSERT_ISSUE_URLS: "true"
                CLOSE_ISSUES: "true"
            env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Pushes made with GITHUB_TOKEN don't trigger workflows; [skip ci] makes it explicit.
          - name: Commit issue URLs inserted into TODOs
            run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add -A
                if [ -n "$(git status --porcelain)" ]; then
                  git commit -m "Add GitHub issue links to TODOs [skip ci]"
                  git push origin HEAD:${{ github.ref_name }}
                else
                  echo "No changes to commit"
                fi